<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="bootcss.css">
</head>

<body>
    <h1 class="text-center">Pricing</h1>
    <p class="text-center">Please checkout our most effictive models</p>
    <div class="container">
        <div class="row text-center justify-content-evenly">
            <div class="card col-sm-5 col-md-3 mb-3 me-3">
                <div class="card-header">
                    <h4>Free</h4>
                </div>
                <div class="card-body">
                    <div class="card-title"><h1>$0 /mo</h1></div>
                    <ul class="list-unstyled">
                        <li> 10 users included </li>
                        <li> 2GB of storage</li>
                        <li>Email support</li>
                    </ul>
                    <button type="button" class="btn btn-outline-primary">Sign up for free</button>
                </div>
                
            </div>

            <div class="card col-sm-5 col-md-3 mb-3 me-3">
                <div class="card-header">
                    <h4>Pro</h4>
                </div>
                <div class="card-body">
                    <div class="card-title"><h1>$15 /mo</h1></div>
                    <ul class="list-unstyled">
                        <li> 20 users included </li>
                        <li> 10GB of storage</li>
                        <li>Priority Email support</li>
                    </ul>
                    <button type="button" class="btn btn-primary">Get Started </button>
                </div>
                
            </div>
            


            <div class="card col-sm-5 col-md-3 mb-3 me-3">
                <div class="card-header">
                    <h4>Enterprise </h4>
                </div>
                <div class="card-body">
                    <div class="card-title"><h1>$29 /mo</h1></div>
                    <ul class="list-unstyled">
                        <li> 30 users included </li>
                        <li> 15GB of storage</li>
                        <li>Phone & Email support</li>
                    </ul>
                    <button type="button" class="btn btn-primary">Contact Us </button>
                </div>
                
            </div>




        </div>
    </div>






    





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
